<style>
  :root { --bg: #F2F4F3; --card: #fff; --text: #243A3A; --muted: #596966; --primary: #297D74; --on-primary: #fff; --line: #D2DFDA; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121A1D; --card: #1C272B; --text: #E1ECE9; --muted: #AFBFBA; --primary: #83D5C5; --on-primary: #073B33; --line: #3F504B; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  .brand { font-weight: 600; color: var(--primary); }
  h1 { font-size: 30px; line-height: 1.2; margin: 12px 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  .button { display: inline-block; text-decoration: none; font-weight: 600; border-radius: 14px; padding: 13px 20px;
            background: var(--primary); color: var(--on-primary); }
</style>
</head>
<body>
<main>
  <div class="brand">AnatomyGo</div>
  <h1>A 3D anatomy atlas for Android</h1>

  <a class="button" href="https://play.google.com/store/apps/details?id=com.anatomygo&amp;referrer=utm_source%3Dsite%26utm_medium%3Dweb">Get it on Google Play</a>
