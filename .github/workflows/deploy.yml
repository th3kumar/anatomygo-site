name: Deploy AnatomyGo website
# Deliberate rollout only, after OAuth/admin smoke tests. No push-triggered deployment.
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}  # optional: Google's own sign-in button
      SEO_STRICT: 1  # scripts/build-seo.mjs must read the live pins, or the deploy stops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json
      - name: Require public backend configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_secret_*) exit 1;; esac
      - run: npm ci && npm --prefix playground ci
      - run: npm run check && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      # Tells Bing (which ChatGPT search and Copilot draw on) and the other IndexNow engines that these pages changed,
      # so they are crawled again within hours instead of weeks. The key is public by design: IndexNow checks that
      # https://anatomygo.in/<key>.txt holds it, to prove the site sent the ping. A failed ping never fails the deploy.
      - name: Ping search engines (IndexNow)
        continue-on-error: true
        env:
          INDEXNOW_KEY: 8d98fedd50be6f5f7ae39f22ee129ea5
        # scripts/build-seo.mjs lists the addresses: the main pages and every structure page under /anatomy/.
        run: |
          jq -n --arg key "$INDEXNOW_KEY" --slurpfile urls indexnow-urls.json \
            '{host:"anatomygo.in",key:$key,keyLocation:("https://anatomygo.in/"+$key+".txt"),urlList:$urls[0]}' \
          | curl -fsS -m 30 -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d @- \
            -w 'IndexNow: HTTP %{http_code}\n'
